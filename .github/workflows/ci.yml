name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Build (universal)
        run: swift build -c release --arch arm64 --arch x86_64
      - name: Test (SlimreelKit; no Photos library needed)
        run: swift test
